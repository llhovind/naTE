name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libgtk-3-dev libssl-dev \
            dpkg-dev rpm

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build-release/_deps
            build-appimage/_deps
          key: fetchcontent-release-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: fetchcontent-release-

      - name: Configure (debug)
        run: cmake --preset debug

      - name: Build tests
        run: cmake --build --preset debug --target naTE_tests

      - name: Run tests
        run: ctest --preset debug

      - name: Configure (release)
        run: cmake --preset release

      - name: Build release binary
        run: cmake --build build-release --parallel $(nproc)

      - name: Create portable tarball
        run: |
          TAG="${{ github.ref_name }}"
          DIR="naTE-${TAG}-linux-x86_64"
          mkdir -p "${DIR}"
          cp build-release/naTE "${DIR}/"
          cp config.ini "${DIR}/"
          cp -r themes "${DIR}/"
          tar -czf "${DIR}.tar.gz" "${DIR}"

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Package DEB
        working-directory: build-appimage
        run: cpack -G DEB

      - name: Package RPM
        working-directory: build-appimage
        run: cpack -G RPM

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          DEB=$(ls build-appimage/*.deb)
          RPM=$(ls build-appimage/*.rpm)
          gh release create "${TAG}" \
            "naTE-${TAG}-linux-x86_64.tar.gz" \
            "${DEB}" \
            "${RPM}" \
            naTE-x86_64.AppImage \
            --title "naTE ${TAG}" \
            --generate-notes
