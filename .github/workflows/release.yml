name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libgtk-3-dev libssl-dev zlib1g-dev

      - name: Cache FetchContent downloads
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-linux-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: fetchcontent-linux-

      - name: Configure
        run: cmake --preset debug

      - name: Build tests
        run: cmake --build --preset debug --target naTE_tests naTE_core_tests naTE_restore_tests

      - name: Run tests
        run: ctest --preset debug

  create-release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "naTE ${{ github.ref_name }}" \
            --generate-notes \
            --draft

  release-linux:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libgtk-3-dev libssl-dev zlib1g-dev \
            dpkg-dev rpm \
            librsvg2-bin xxd

      - name: Cache FetchContent downloads
        uses: actions/cache@v5
        with:
          path: build-appimage/_deps
          key: fetchcontent-release-linux-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: fetchcontent-release-linux-

      - name: Configure
        run: cmake --preset appimage

      - name: Build
        run: cmake --build build-appimage --parallel $(nproc)

      - name: Create portable tarball
        run: |
          TAG="${{ github.ref_name }}"
          DIR="naTE-${TAG}-linux-x86_64"
          mkdir -p "${DIR}"
          cp build-appimage/naTE "${DIR}/"
          cp config.ini "${DIR}/"
          cp -r themes "${DIR}/"
          cp -r helpers "${DIR}/"
          cp packaging/naTE.desktop "${DIR}/"
          cp packaging/nate.svg "${DIR}/"
          for size in 16 32 48 128 256; do
            cp "src/ui/resources/nate_${size}.png" "${DIR}/"
          done
          tar -czf "${DIR}.tar.gz" "${DIR}"

      - name: Build AppImage
        run: ./scripts/build-appimage.sh --skip-configure

      - name: Package DEB
        working-directory: build-appimage
        run: cpack -G DEB

      - name: Package RPM
        working-directory: build-appimage
        run: cpack -G RPM

      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          DEB=$(ls build-appimage/*.deb)
          RPM=$(ls build-appimage/*.rpm)
          gh release upload "${TAG}" \
            "naTE-${TAG}-linux-x86_64.tar.gz" \
            "${DEB}" \
            "${RPM}" \
            naTE-x86_64.AppImage

  release-macos:
    if: false
    needs: create-release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: brew install ninja

      - name: Cache FetchContent downloads
        uses: actions/cache@v5
        with:
          path: build-release/_deps
          key: fetchcontent-release-macos-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: fetchcontent-release-macos-

      - name: Generate app icon
        run: bash scripts/gen-icns.sh

      - name: Configure (release)
        run: cmake --preset release -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build
        run: cmake --build build-release --parallel $(sysctl -n hw.logicalcpu)

      - name: Package DMG
        run: |
          TAG="${{ github.ref_name }}"
          ARCH=$(uname -m)
          mkdir dmg_staging
          cp -r build-release/naTE.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "naTE ${TAG}" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "naTE-${TAG}-macos-${ARCH}.dmg"

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ARCH=$(uname -m)
          gh release upload "${TAG}" "naTE-${TAG}-macos-${ARCH}.dmg"

  publish:
    needs: [release-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
