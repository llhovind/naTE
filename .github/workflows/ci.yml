name: CI

on:
  push:
    branches: [main, 'release-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libgtk-3-dev libssl-dev zlib1g-dev

      - name: Cache FetchContent downloads
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-linux-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: fetchcontent-linux-

      - name: Configure
        run: cmake --preset debug

      - name: Build tests
        run: cmake --build --preset debug --target naTE_tests naTE_core_tests naTE_restore_tests

      - name: Run tests
        run: ctest --preset debug

  test-macos:
    if: false
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: brew install ninja

      - name: Cache FetchContent downloads
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-macos-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: fetchcontent-macos-

      - name: Configure
        run: cmake --preset debug -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build tests
        run: cmake --build --preset debug --target naTE_tests naTE_core_tests naTE_restore_tests

      - name: Run tests
        run: ctest --preset debug
