[Appearance]
ColorTheme=solarized-dark
FontFamily=
Padding=4
CursorStyle=Block
CursorBlink=true

[Behavior]
Encoding=UTF-8
WebSearchUrl=https://duckdukgo.com/?q=
BellMode=Visual
CopyOnSelect=true

[Panel]
Columns=80
Rows=24
FontSize=12
PtyLineWidth=4096
ScrollbackLines=100000

[Terminal]
GeometryPresets=80x24,110x24,120x24,132x24

[Session]
DefaultShell=
DefaultWorkingDir=~
DefaultLoginShell=true
DefaultWrapMode=true
DefaultEnvFile=
# Per-var overrides: EnvVar0Key=NAME, EnvVar0Value=value (up to EnvVar63)
AutoRestoreSession=false
SessionSaveInterval=300
